<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">OfficeWars</title>
  <desc id="desc">A seven-floor office tower being climbed floor by floor, a project race against Chad with a stress bar, and three task responses: Comply, Resist and Negotiate. Decorative project artwork.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d1f"/>
      <stop offset="0.52" stop-color="#151a33"/>
      <stop offset="1" stop-color="#0b1126"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2142"/>
      <stop offset="1" stop-color="#121731"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f0a020" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#background)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="358" rx="27" fill="none" stroke="#f0a020" stroke-opacity="0.25" stroke-width="2"/>

  <ellipse cx="190" cy="190" rx="170" ry="140" fill="#f0a020" fill-opacity="0.10" filter="url(#softGlow)"/>
  <ellipse cx="1080" cy="180" rx="170" ry="130" fill="#53c7e8" fill-opacity="0.09" filter="url(#softGlow)"/>

  <!-- 1. The tower: seven floors, three climbed, the fourth in progress -->
  <g font-family="'Courier New', monospace" font-size="13" font-weight="700">
    <text x="190" y="38" text-anchor="middle" fill="#f0a020" filter="url(#glow)">CEO</text>
    <g fill="#8b93b8" fill-opacity="0.75">
      <text x="62" y="73">F7</text><text x="62" y="111">F6</text><text x="62" y="149">F5</text>
      <text x="62" y="187" fill="#42d392" fill-opacity="1">F4</text>
      <text x="62" y="225">F3</text><text x="62" y="263">F2</text><text x="62" y="301">F1</text>
    </g>
  </g>
  <g transform="translate(90 0)">
    <!-- Floors still to climb -->
    <g fill="#141a36" stroke="#3a4270" stroke-width="2">
      <rect x="0" y="52" width="200" height="32" rx="5"/>
      <rect x="0" y="90" width="200" height="32" rx="5"/>
      <rect x="0" y="128" width="200" height="32" rx="5"/>
    </g>
    <g fill="#3a4270" fill-opacity="0.6">
      <rect x="16" y="62" width="22" height="12" rx="2"/><rect x="54" y="62" width="22" height="12" rx="2"/><rect x="92" y="62" width="22" height="12" rx="2"/><rect x="130" y="62" width="22" height="12" rx="2"/><rect x="168" y="62" width="18" height="12" rx="2"/>
      <rect x="16" y="100" width="22" height="12" rx="2"/><rect x="54" y="100" width="22" height="12" rx="2"/><rect x="92" y="100" width="22" height="12" rx="2"/><rect x="130" y="100" width="22" height="12" rx="2"/><rect x="168" y="100" width="18" height="12" rx="2"/>
      <rect x="16" y="138" width="22" height="12" rx="2"/><rect x="54" y="138" width="22" height="12" rx="2"/><rect x="92" y="138" width="22" height="12" rx="2"/><rect x="130" y="138" width="22" height="12" rx="2"/><rect x="168" y="138" width="18" height="12" rx="2"/>
    </g>
    <!-- The current floor -->
    <rect x="0" y="166" width="200" height="32" rx="5" fill="#16302a" stroke="#42d392" stroke-width="2.5" filter="url(#glow)"/>
    <g fill="#42d392" fill-opacity="0.85">
      <rect x="16" y="176" width="22" height="12" rx="2"/><rect x="54" y="176" width="22" height="12" rx="2"/>
    </g>
    <rect x="92" y="172" width="44" height="20" rx="4" fill="#f0a020"/>
    <text x="114" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#151a33">YOU</text>
    <!-- Floors already climbed -->
    <g fill="#1e1d2c" stroke="#f0a020" stroke-opacity="0.55" stroke-width="2">
      <rect x="0" y="204" width="200" height="32" rx="5"/>
      <rect x="0" y="242" width="200" height="32" rx="5"/>
      <rect x="0" y="280" width="200" height="32" rx="5"/>
    </g>
    <g fill="#f0a020" fill-opacity="0.8">
      <rect x="16" y="214" width="22" height="12" rx="2"/><rect x="54" y="214" width="22" height="12" rx="2"/><rect x="92" y="214" width="22" height="12" rx="2"/><rect x="130" y="214" width="22" height="12" rx="2"/><rect x="168" y="214" width="18" height="12" rx="2"/>
      <rect x="16" y="252" width="22" height="12" rx="2"/><rect x="54" y="252" width="22" height="12" rx="2"/><rect x="92" y="252" width="22" height="12" rx="2"/><rect x="130" y="252" width="22" height="12" rx="2"/><rect x="168" y="252" width="18" height="12" rx="2"/>
      <rect x="16" y="290" width="22" height="12" rx="2"/><rect x="54" y="290" width="22" height="12" rx="2"/><rect x="92" y="290" width="22" height="12" rx="2"/><rect x="130" y="290" width="22" height="12" rx="2"/><rect x="168" y="290" width="18" height="12" rx="2"/>
    </g>
  </g>

  <path d="M318 180 H376" stroke="#f0a020" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="6 8"/>
  <path d="M370 172 L382 180 L370 188" fill="none" stroke="#f0a020" stroke-opacity="0.7" stroke-width="3"/>

  <!-- 2. The project race: you against Chad, with stress rising -->
  <g transform="translate(402 66)">
    <rect width="452" height="228" rx="18" fill="url(#card)" stroke="#f0a020" stroke-opacity="0.55" stroke-width="2"/>
    <text x="28" y="42" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#f0a020">PROJECT RACE</text>
    <rect x="28" y="84" width="396" height="20" rx="6" fill="#0d1226" stroke="#3a4270"/>
    <rect x="28" y="84" width="246" height="20" rx="6" fill="#42d392" fill-opacity="0.85"/>
    <rect x="252" y="56" width="44" height="20" rx="4" fill="#f0a020" filter="url(#glow)"/>
    <text x="274" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#151a33">YOU</text>
    <path d="M274 76 V84" stroke="#f0a020" stroke-width="2"/>
    <rect x="166" y="112" width="52" height="20" rx="4" fill="#ef625e"/>
    <text x="192" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">CHAD</text>
    <path d="M192 104 V112" stroke="#ef625e" stroke-width="2"/>
    <text x="28" y="152" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#c9cde3">STRESS</text>
    <rect x="104" y="140" width="320" height="16" rx="5" fill="#0d1226" stroke="#3a4270"/>
    <rect x="104" y="140" width="70" height="16" rx="5" fill="#ef625e" fill-opacity="0.9"/>
    <g font-family="'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle">
      <circle cx="46" cy="186" r="11" fill="#42d392" fill-opacity="0.9"/><text x="46" y="211" fill="#8b93b8">MON</text>
      <circle cx="132" cy="186" r="11" fill="#42d392" fill-opacity="0.9"/><text x="132" y="211" fill="#8b93b8">TUE</text>
      <circle cx="218" cy="186" r="11" fill="none" stroke="#f0a020" stroke-width="3" filter="url(#glow)"/><text x="218" y="211" fill="#f0a020">WED</text>
      <circle cx="304" cy="186" r="11" fill="none" stroke="#3a4270" stroke-width="2.5"/><text x="304" y="211" fill="#8b93b8">THU</text>
      <circle cx="390" cy="186" r="11" fill="none" stroke="#3a4270" stroke-width="2.5"/><text x="390" y="211" fill="#8b93b8">FRI</text>
    </g>
  </g>

  <path d="M872 180 H930" stroke="#53c7e8" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="6 8"/>
  <path d="M924 172 L936 180 L924 188" fill="none" stroke="#53c7e8" stroke-opacity="0.7" stroke-width="3"/>

  <!-- 3. Today's response: Comply, Resist or Negotiate -->
  <g font-family="'Courier New', monospace" font-size="12" font-weight="700">
    <g transform="translate(952 104) rotate(-7 60 90)">
      <rect width="120" height="178" rx="10" fill="url(#card)" stroke="#42d392" stroke-width="2"/>
      <rect x="10" y="12" width="100" height="22" rx="5" fill="#42d392" fill-opacity="0.18"/>
      <text x="60" y="28" text-anchor="middle" fill="#42d392">COMPLY</text>
      <g fill="#c9cde3" fill-opacity="0.55"><rect x="14" y="52" width="92" height="7" rx="3.5"/><rect x="14" y="70" width="74" height="7" rx="3.5"/><rect x="14" y="88" width="84" height="7" rx="3.5"/></g>
      <text x="14" y="160" fill="#42d392">+10 PP</text>
    </g>
    <g transform="translate(1136 108) rotate(7 60 90)">
      <rect width="120" height="178" rx="10" fill="url(#card)" stroke="#53c7e8" stroke-width="2"/>
      <rect x="10" y="12" width="100" height="22" rx="5" fill="#53c7e8" fill-opacity="0.18"/>
      <text x="66" y="28" text-anchor="middle" fill="#53c7e8">NEGOTIATE</text>
      <g fill="#c9cde3" fill-opacity="0.55"><rect x="14" y="52" width="80" height="7" rx="3.5"/><rect x="14" y="70" width="92" height="7" rx="3.5"/><rect x="14" y="88" width="70" height="7" rx="3.5"/></g>
      <text x="106" y="160" text-anchor="end" fill="#53c7e8">-$50</text>
    </g>
    <g transform="translate(1046 82)">
      <rect width="120" height="178" rx="10" fill="url(#card)" stroke="#f0a020" stroke-width="2.5" filter="url(#glow)"/>
      <rect x="10" y="12" width="100" height="22" rx="5" fill="#f0a020" fill-opacity="0.2"/>
      <text x="60" y="28" text-anchor="middle" fill="#f0a020">RESIST</text>
      <g fill="#c9cde3" fill-opacity="0.55"><rect x="14" y="52" width="88" height="7" rx="3.5"/><rect x="14" y="70" width="92" height="7" rx="3.5"/><rect x="14" y="88" width="64" height="7" rx="3.5"/></g>
      <text x="14" y="160" fill="#ef625e">+11% STRESS</text>
    </g>
  </g>
</svg>
