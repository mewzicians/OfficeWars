      var failed = Object.keys(result).filter(function (key) { return !result[key]; });
      document.title = failed.length
        ? 'FAIL:' + failed.join(',') +
          (frame.contentWindow.__playbackDifference
            ? ':' + frame.contentWindow.__playbackDifference
            : '')
        : 'PASS:OVERHAUL';
    } catch (error) {
      var stack = String(error.stack || '').replace(/\s+/g, ' ').slice(0, 500);
      document.title = 'ERROR:' + (frame.contentWindow.__smokeStage || 'base') + ':' +
        error.name + ':' + error.message + ':' + stack;
    }
  }, 500);
});
</script>
